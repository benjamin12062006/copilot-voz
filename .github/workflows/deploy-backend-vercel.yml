name: Desplegar backend en Vercel

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend-vercel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.node-version
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verificar configuración del despliegue
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Falta VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Falta VERCEL_BACKEND_PROJECT_ID'; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo 'Falta VERCEL_BACKEND_TOKEN'; exit 1; }
      - run: uv sync --locked --python 3.12
      - run: uv run --locked --python 3.12 python -m unittest discover -s tests -v
      - run: npm install --global vercel@65.9.0
      - name: Obtener configuración de Vercel
        run: vercel pull --yes --environment=production
      - name: Compilar FastAPI
        run: vercel build --prod
      - name: Desplegar los artefactos compilados
        run: vercel deploy --prebuilt --prod --json > deployment.json
      - name: Verificar salud de producción
        run: |
          deployment_url=$(python -c "import json; d=json.load(open('deployment.json')); d=d.get('deployment',d); u=d.get('productionUrl') or d['url']; print(u if u.startswith('https://') else 'https://'+u)")
          vercel curl /health --deployment "$deployment_url" -- --fail --retry 5 --retry-all-errors
          echo "Backend: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
